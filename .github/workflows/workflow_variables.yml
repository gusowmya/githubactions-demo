name: Testing Workflow variables

on:
 workflow_dispatch: 

env:
  cloud : google-cloud
  
jobs:
  greeting_job: 
    runs-on: ubuntu_latest
    env:
      Greeting: hello
    steps:
      - name: "hello"
        run: echo "$Greeting $First_Name is using $cloud!"
        env:
          First_Name: Sowmya

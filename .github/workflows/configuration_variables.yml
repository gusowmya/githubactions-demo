name:  Testing configuration_variables

on:
  workflow_dispatch:

env:
  cloud: google_cloud

jobs:
  greeting_job:
     runs-on: ubuntu-latest
     env:
       Greeting: Hello
     steps:
       - name: "say Hello to sowmya"
         run: echo "$Greeting $First_name is using $cloud with project ${{ vars.PROJECT_ID }}!"
         env:
           First_name: Sowmya
